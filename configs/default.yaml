app: {version: 3.0.0, host: 127.0.0.1}
paths: {data: data, output: out_dir, database: howvision.db, hand_model: models/hand_landmarker.task, registry: models/registry.json}
input: {images: [.jpg, .jpeg, .png, .bmp, .webp], videos: [.mp4, .avi, .mov, .mkv]}
perception: {hand_confidence: 0.5, wheel_confidence: 0.25}
classifier: {contact_distance: 0.18, no_contact_distance: 0.30}
temporal: {confidence_threshold: 0.42, smoothing_window: 5, on_confirmation_frames: 2, off_confirmation_frames: 3, unknown_timeout: 4}
training: {epochs: 30, learning_rate: 0.001, batch_size: 8, hidden_width: 24, weight_decay: 0.0001, validation_fraction: 0.2, early_stopping_patience: 6, gradient_clip: 1.0, seed: 42}
review: {brush_size: 18, min_brush: 6, max_brush: 64}
