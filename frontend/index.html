<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>HOW Vision</title><link rel="stylesheet" href="style.css"></head><body><header><b>HOW VISION</b><nav><button data-tab="infer">Inference</button><button data-tab="review">Review</button><button data-tab="tune">Fine-tune</button><button data-tab="models">Models</button></nav><div id="runtime">LOCAL</div></header><main><section id="infer" class="tab active"><div class="hero"><small>RGB WORKBENCH</small><h1>Inference</h1></div><div class="cols"><article class="card"><div class="media"><img id="inputPreview"></div><label class="upload">Upload<input id="file" type="file" hidden></label><select id="inputs"></select><h3>Compute device</h3><div id="devices" class="devices"></div><button id="start" class="primary">Launch inference</button><p id="deviceStatus"></p></article><article class="card"><div class="media"><img id="preview"></div><div id="status" class="status unknown">UNKNOWN</div><progress id="progress" max="100"></progress><div class="metrics"><b id="frames">0 / 0</b><b id="confidence">0%</b><b id="usedDevice">CPU</b></div></article></div></section><section id="review" class="tab"><div class="hero"><small>HUMAN FEEDBACK</small><h1>Review Studio</h1></div><div class="cols review"><aside class="card"><select id="runs"></select><input id="frameRange" type="range" min="0" value="0"><div id="reviewedNav"></div></aside><article class="card"><div class="media reviewMedia"><img id="reviewImage"><canvas id="paint"></canvas></div><div class="labels"><button data-label="BOTH_ON">Both on</button><button data-label="LEFT_ON">Left on</button><button data-label="RIGHT_ON">Right on</button><button data-label="NONE_ON">Hands off</button><button data-label="UNKNOWN">Unclear</button></div><div class="toolbar"><button id="hand">Hand mask</button><button id="wheel">Wheel mask</button><button id="undo">Undo</button><button id="clear">Clear</button></div><p id="reviewState">No unsave
