<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hands On Wheel</title><link rel="stylesheet" href="/style.css?v=0.9.0"></head><body><header><b>Hands On Wheel</b><nav><button data-tab="run">Inference</button><button data-tab="review">Review Studio</button><button data-tab="tune">Fine-tune</button><button data-tab="modelsTab">Models</button></nav><div id="systemHud"><b id="hudState">BOOT</b><span id="hudCpu">CPU --</span><span id="hudGpu">GPU --</span><span id="hudClock">--:--:--</span></div></header><main><section id="run" class="tab active"><h1>Inference</h1><div class="grid"><article class="glass"><div class="preview"><img id="inputPreview"></div><button id="uploadBtn">Upload input</button><input id="file" type="file" hidden><select id="inputs"></select><select id="models"></select><button id="start" class="primary">Launch inference</button></article><article class="glass"><div class="preview"><img id="live"></div><div id="decision" class="decision unknown"><b id="label">UNKNOWN</b><span id="confidence">0%</span></div><div class="bar"><i id="bar"></i></div><div class="stats"><b id="frame">0 / 0</b><b id="fps">0 FPS</b><b id="process">0 MB</b></div></article></div><div id="recent" class="glass"></div></section><section id="review" class="tab"><h1>Review Studio</h1><div class="studio"><aside class="glass"><div id="cueList"></div></aside><article class="glass"><div class="reviewHead"><div>MODEL <b id="original">UNKNOWN</b></div><div>FRAME <b id="fid">0</b></div><div>STATUS <b id="savedState" class="clean">No edits</b></div></div><div class="toolbar"><button id="zoomOut">−</button><b id="zoomValue">100%</b><button id="zoomIn">＋</button><button id="fit">Fit</button><button id="actual">1:1</button><button id="move">Move</button><button id="resetView">Reset</button><label><input id="maskToggle" type="checkbox" checked> Predicted masks</label></div><div id="viewport"><div id="scene"><img id="reviewImage"><canvas id="predictionCanvas"></canvas><canvas id="editor"></canvas></div></div><div id="scrubber" class="hidden"><div class="jump"><button id="prevAnn">◀ Reviewed</button><b id="annCount">0 reviewed</b><button id="nextAnn">Reviewed ▶</button></div><input id="range" type="range" min="0" value="0"><div class="times"><span id="timeNow">00:00.000</span><span id="timeEnd">00:00.000</span></div></div><div class="pills"><button data-label="BOTH_ON">Both on</button><button data-label="LEFT_ON">Left on</button><button data-label="RIGHT_ON">Right on</button><button data-label="NONE_ON">Hands off</button><button data-label="UNKNOWN">Unclear</button></div><div class="tools"><button id="handBrush">Hand brush</button><button id="wheelBrush">Wheel brush</button><button id="eraser">Eraser</button><label>Size <input id="brushRange" type="range" min="6" max="64" value="18"><b id="brushSize">18</b></label><button id="undo">Undo</button><button id="reset">Clear</button></div><div class="saveRow"><label>Sample loss weight <input id="reward" type="range" min="0" max="2" step=".25" value="1"><b id="weightValue">1.00×</b></label><button id="save" class="primary">Save reviewed frame</button></div></article></div><div id="saveToast" class="toast hidden"><b>Unsaved frame edits</b><span>Save before leaving this frame?</span><div class="toastActions"><button id="toastUndo">Undo last</button><button id="toastDiscard">Discard & continue</button><button id="toastSave" class="primary">Save & continue</button></div></div></section><section id="tune" class="tab"><h1>Fine-tune</h1><div class="glass"><div><b id="selectedCount">0 selected</b><button id="selectAll">Select all</button><button id="selectNone">Select none</button></div><div id="trainingPreview"></div><button id="train" class="primary">Train selected frames</button><pre id="trainLog"></pre></div></section><section id="modelsTab" class="tab"><h1>Models</h1><div id="modelList" class="glass"></div></section></main><script src="/app.js?v=0.9.0"></script></body></html>
