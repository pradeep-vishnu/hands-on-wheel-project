[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "how-vision"
version = "0.2.0"
description = "Local-first RGB Hands-On-Wheel performance workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3",
  "opencv-python>=4.8,<5", "numpy>=1.26,<3", "PyYAML>=6,<7",
  "python-multipart>=0.0.9,<1", "mediapipe>=0.10.14,<0.11"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
howvision = "howvision.__main__:main"
[tool.setuptools.packages.find]
include = ["howvision*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
